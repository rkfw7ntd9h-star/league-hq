name: Normalize Draft Pick Value
on:
  push:
    paths:
      - 'scripts/normalize_draft_pick_value.py'
      - '.github/workflows/normalize-draft-pick-value.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/normalize_draft_pick_value.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'const draftPosRank={}' in s
          assert 'prevents high-scoring positions like QB from dominating' in s
          assert 'function draftAnalysis(h,picks){' in s
          assert 'assets/traphouse-banner.webp' in s
          print('positional draft value verified')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Normalize best picks by position'
          git push
