name: Upgrade matchup detail
on:
  push:
    paths:
      - '.github/workflows/matchup-detail-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch matchup detail UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          css = """
          .matchup-detail{margin-top:8px}.matchup-hero{background:linear-gradient(180deg,#075038,#043a2a);color:#fff;border-radius:14px;padding:14px 12px;margin-bottom:12px}.matchup-hero-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.matchup-team-name{font:1000 18px/1.05 Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;text-transform:uppercase}.matchup-score{font-size:29px;font-weight:1000;margin-top:5px}.matchup-proj{font-size:10px;color:#d8eadf;margin-top:2px}.matchup-vs{font:1000 22px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;color:#f5f0e4}.matchup-h2h{text-align:center;font-size:9px;color:#d8eadf;margin-top:10px}.lineup-label{margin:13px 0 5px;font:1000 15px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;text-transform:uppercase;color:var(--forest)}.slot-row{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);align-items:stretch;border-top:1px solid #ddd9d2}.slot-player{padding:9px 6px;min-width:0}.slot-player.right{text-align:right}.slot-name{font-weight:900;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot-meta{font-size:8px;color:var(--muted);margin-top:2px}.slot-points{font-size:15px;font-weight:1000;color:var(--ink);margin-top:5px}.slot-proj{font-size:8px;color:var(--green);margin-top:1px}.slot-badge{align-self:center;justify-self:center;width:34px;height:26px;display:grid;place-items:center;border-radius:7px;background:#e4efe9;color:var(--forest);font-size:8px;font-weight:1000}.bench-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #ddd9d2}.bench-row .slot-player{padding-top:8px;padding-bottom:8px}.matchup-empty{color:#9aa39e;font-size:9px}.sheet.matchup-sheet{padding-left:10px;padding-right:10px}@media(max-width:420px){.matchup-team-name{font-size:16px}.matchup-score{font-size:25px}.slot-row{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr)}.slot-name{font-size:10px}.slot-points{font-size:14px}}
          """
          if '.matchup-detail{' not in s:
              s = s.replace('</style></head>', css.strip() + '</style></head>')
          start = s.index('function showMatchup(a,b)')
          end = s.index('function renderStandings', start)
          js = """function projFor(id){const v=state.projections?.[id];return Number.isFinite(+v)?+v:null}function actualFor(m,id){const v=m?.players_points?.[id];return Number.isFinite(+v)?+v:0}function slotMeta(id){if(!id||id==='0')return'';const p=player(id),bits=[];if(p.position)bits.push(p.position);if(p.team)bits.push(p.team);return bits.join(' / ')}function slotPlayer(m,id,side='left'){if(!id||id==='0')return `<div class=\"slot-player ${side==='right'?'right':''}\"><div class=\"matchup-empty\">Empty</div></div>`;const p=player(id),pr=projFor(id);return `<div class=\"slot-player ${side==='right'?'right':''}\"><div class=\"slot-name\">${esc(p.full_name)}</div><div class=\"slot-meta\">${esc(slotMeta(id))}</div><div class=\"slot-points\">${actualFor(m,id).toFixed(1)}</div><div class=\"slot-proj\">Proj ${pr===null?'--':pr.toFixed(1)}</div></div>`}function starterSlots(){const x=state.league?.roster_positions||[];return x.filter(v=>!['BN','IR','TAXI'].includes(String(v).toUpperCase()))}function showMatchup(a,b){const ma=state.matchups.find(m=>m.roster_id===a),mb=state.matchups.find(m=>m.roster_id===b);if(!ma||!mb)return;const ra=state.rosters.find(x=>x.roster_id===a),rb=state.rosters.find(x=>x.roster_id===b),h=h2h(ra?.owner_id,rb?.owner_id),slots=starterSlots(),sa=ma.starters||[],sb=mb.starters||[],rows=Math.max(slots.length,sa.length,sb.length);const starterHtml=Array.from({length:rows},(_,i)=>{const label=slots[i]||player(sa[i]||sb[i]).position||'FLEX';return `<div class=\"slot-row\">${slotPlayer(ma,sa[i],'left')}<div class=\"slot-badge\">${esc(label)}</div>${slotPlayer(mb,sb[i],'right')}</div>`}).join('');const ba=(ma.players||[]).filter(id=>!sa.includes(id)),bb=(mb.players||[]).filter(id=>!sb.includes(id)),bn=Math.max(ba.length,bb.length);const benchHtml=Array.from({length:bn},(_,i)=>`<div class=\"bench-row\">${slotPlayer(ma,ba[i],'left')}${slotPlayer(mb,bb[i],'right')}</div>`).join('')||'<div class=\"empty\">No bench players listed.</div>';const pa=projected(ma),pb=projected(mb);openModal(`${teamName(ra)} vs ${teamName(rb)}`,`<div class=\"matchup-detail\"><div class=\"matchup-hero\"><div class=\"matchup-hero-grid\"><div><div class=\"matchup-team-name\">${esc(teamName(ra))}</div><div class=\"matchup-score\">${(+ma.points||0).toFixed(1)}</div><div class=\"matchup-proj\">Projected ${pa?pa.toFixed(1):'--'}</div></div><div class=\"matchup-vs\">VS</div><div><div class=\"matchup-team-name\">${esc(teamName(rb))}</div><div class=\"matchup-score\">${(+mb.points||0).toFixed(1)}</div><div class=\"matchup-proj\">Projected ${pb?pb.toFixed(1):'--'}</div></div></div><div class=\"matchup-h2h\">Career series ${h.a}-${h.b}${h.t?'-'+h.t:''}${pa&&pb?' / Projected edge '+Math.abs(pa-pb).toFixed(1)+' pts':''}</div></div><div class=\"lineup-label\">Starters</div>${starterHtml}<div class=\"lineup-label\">Bench</div>${benchHtml}</div>`,'Week '+week()+' matchup');document.querySelector('#modal .sheet')?.classList.add('matchup-sheet')}"""
          s = s[:start] + js + s[end:]
          marker = "function openModal(t,b,e='League HQ'){"
          if marker in s and "classList.remove('matchup-sheet')" not in s:
              s = s.replace(marker, marker + "document.querySelector('#modal .sheet')?.classList.remove('matchup-sheet');", 1)
          p.write_text(s)
          PY
      - name: Commit matchup detail upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build Sleeper-style matchup detail view"
          git push
