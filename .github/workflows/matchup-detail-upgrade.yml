name: Upgrade matchup detail
on:
  push:
    paths:
      - '.github/workflows/matchup-detail-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch matchup detail UI
        run: python -c "import base64;exec(base64.b64decode('<=REDACTED_B64>'))"
      - name: Commit matchup detail upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build Sleeper-style matchup detail view"
          git push
