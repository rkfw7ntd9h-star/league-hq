name: Fix Recap History Source
on:
  push:
    paths:
      - 'scripts/fix_recap_history_source.py'
      - '.github/workflows/fix-recap-history-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_recap_history_source.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'function renderRecap(){const current=+state.league?.season||0' in s
          assert 'historyEvent();renderRecap();renderManagers();' in s
          assert 'async function renderRecap()' not in s
          assert 'assets/traphouse-banner.webp' in s
          print('history-backed recap verified')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Use loaded history for recap'
          git push
