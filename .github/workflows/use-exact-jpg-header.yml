name: Use exact JPG header
on:
  push:
    paths:
      - '.github/workflows/use-exact-jpg-header.yml'
permissions:
  contents: write
jobs:
  swap-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point masthead at exact uploaded JPG
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/trap-lockup.svg','assets/trap-header.jpg?v=20260910-exact')
          p.write_text(s)
          PY
      - name: Commit header swap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use exact uploaded JPG as masthead"
          git push
