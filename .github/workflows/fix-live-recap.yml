name: Fix Live Recap
on:
  push:
    paths:
      - 'scripts/fix_recap_live.py'
      - '.github/workflows/fix-live-recap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_recap_live.py
      - name: Verify recap only
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "const current=+state.league?.season||0" in s
          assert "highest-scoring winning performance" in s
          assert "lowest-scoring losing performance" in s
          assert 'assets/traphouse-banner.webp' in s
          print('recap repair verified')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Run recap from latest completed week'
          git push
