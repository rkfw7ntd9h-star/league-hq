name: Upgrade Squirrel Game rivalry click
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-squirrel-rivalry-click.yml'
      - 'scripts/upgrade_squirrel_rivalry_click.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Squirrel Game rivalry
        run: python scripts/upgrade_squirrel_rivalry_click.py
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Upgrade Squirrel Game matchup history'
          git push
