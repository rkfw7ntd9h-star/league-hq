name: Upgrade Draft History

on:
  push:
    paths:
      - '.github/workflows/upgrade-draft-history.yml'
      - 'scripts/upgrade_draft_history.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch site
        run: python scripts/upgrade_draft_history.py
      - name: Commit site change
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Draft History analysis"
          git push
