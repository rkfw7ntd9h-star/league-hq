name: Upgrade manager profiles
on:
  push:
    paths:
      - '.github/workflows/upgrade-manager-profiles.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade manager profiles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
.managerhero{background:linear-gradient(180deg,#075038,#043a2a);color:#fff;border-radius:14px;padding:14px;margin:8px 0 12px}.managerhero h3{margin:0;font:1000 24px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;text-transform:uppercase}.managerhero .tiny{color:#d8eadf}.trophycase{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.trophy{background:#fff6d8;border:1px solid #d9bc67;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:1000;color:#604b12}.profilegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0 12px}.profilestat{background:#f7f2e8;border:1px solid #ddd6c9;border-radius:10px;padding:9px}.profilestat b{display:block;font-size:18px;color:var(--forest)}.profilestat span{font-size:7px;text-transform:uppercase;color:var(--muted);font-weight:900}.seasonline,.rivalryline{display:grid;grid-template-columns:58px 1fr auto;gap:8px;padding:8px 2px;border-top:1px solid #ddd9d2;font-size:9px;align-items:center}.h2hmatrix{overflow-x:auto}.h2htable{border-collapse:collapse;min-width:620px;width:100%;font-size:8px}.h2htable th,.h2htable td{border:1px solid #d9d6cf;padding:6px;text-align:center}.h2htable th{background:#075038;color:#fff}.h2htable td:first-child{font-weight:900;text-align:left;background:#f7f2e8}.h2hwin{background:#e4f2e9}.h2hloss{background:#f6e5e2}.h2heven{background:#f3f0e8}@media(max-width:680px){.profilegrid{grid-template-columns:repeat(2,1fr)}.managerhero h3{font-size:21px}}
'''
          if '.managerhero{' not in s: s=s.replace('</style></head>',css+'</style></head>')
          old='<section class="page" id="page-managers"><div class="sectiontitle"><h2>Managers</h2></div><div class="managergrid" id="managerGrid"></div></section>'
          new='<section class="page" id="page-managers"><div class="sectiontitle"><h2>Managers</h2></div><div class="managergrid" id="managerGrid"></div><div class="sectiontitle"><h2>Manager vs. Manager</h2></div><div class="card span12 h2hmatrix" id="h2hMatrix"></div></section>'
          if old not in s: raise SystemExit('manager section not found')
          s=s.replace(old,new)
          start=s.index('function renderManagers(){')
          end=s.index('function renderRecap(){',start)
          js=r'''function managerSeasonRows(uid){const out=[];state.history.slice().reverse().forEach(h=>{const r=h.rosters.find(x=>x.owner_id===uid);if(!r)return;const champ=h.winners.find(x=>+x.p===1),crid=champ?.w||champ?.roster_id,isChamp=crid&&ownerId(h,crid)===uid;out.push({season:h.season,w:r.settings?.wins||0,l:r.settings?.losses||0,pf:pf(r),champ:isChamp})});return out}function managerRivalries(uid){return careerData().filter(x=>x.uid!==uid).map(x=>({uid:x.uid,h:h2h(uid,x.uid)})).filter(x=>x.h.g).sort((a,b)=>b.h.g-a.h.g)}function managerRecords(uid){let hi=null,lo=null,bigWin=null,bigLoss=null;state.history.forEach(h=>h.weeks.forEach(w=>group(w.matchups).forEach(p=>{const ua=ownerId(h,p[0].roster_id),ub=ownerId(h,p[1].roster_id);if(ua!==uid&&ub!==uid)return;const me=ua===uid?p[0]:p[1],op=ua===uid?p[1]:p[0],v=+me.points||0,d=v-(+op.points||0);if(v>0&&(!hi||v>hi.v))hi={v,season:h.season,week:w.week};if(v>0&&(!lo||v<lo.v))lo={v,season:h.season,week:w.week};if(d>0&&(!bigWin||d>bigWin.d))bigWin={d,season:h.season,week:w.week};if(d<0&&(!bigLoss||d<bigLoss.d))bigLoss={d,season:h.season,week:w.week}})));return{hi,lo,bigWin,bigLoss}}function renderH2HMatrix(){const c=careerData().filter(x=>x.w+x.l>0).sort((a,b)=>managerName(a.uid).localeCompare(managerName(b.uid)));const short=n=>esc(String(n).slice(0,10));$('h2hMatrix').innerHTML=c.length?`<table class="h2htable"><thead><tr><th>Manager</th>${c.map(x=>`<th>${short(managerName(x.uid))}</th>`).join('')}</tr></thead><tbody>${c.map(a=>`<tr><td>${esc(managerName(a.uid))}</td>${c.map(b=>{if(a.uid===b.uid)return'<td>—</td>';const h=h2h(a.uid,b.uid),cl=h.a>h.b?'h2hwin':h.a<h.b?'h2hloss':'h2heven';return`<td class="${cl}">${h.g?`${h.a}-${h.b}${h.t?'-'+h.t:''}`:'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Not enough linked history for the matrix.</div>'}function renderManagers(){const c=careerData().sort((a,b)=>b.w/(b.w+b.l||1)-a.w/(a.w+a.l||1));$('managerGrid').innerHTML=c.map(x=>{const r=state.rosters.find(y=>y.owner_id===x.uid),g=x.w+x.l,title=x.titles.length?`${x.titles.length}× Traphouse Champion`:'Chasing the first title';return`<div class="managercard" data-manager="${esc(x.uid)}"><div class="row"><div class="team">${r&&avatar(r)?`<img class="avatar" src="${avatar(r)}">`:''}<div><div class="teamname">${esc(managerName(x.uid))}</div><div class="tiny">${esc(r?teamName(r):'Historical manager')}</div></div></div></div><div class="managerstats"><span><b>${x.w}-${x.l}</b>Career</span><span><b>${g?(100*x.w/g).toFixed(1):'0.0'}%</b>Win rate</span><span><b>${x.titles.length}</b>Titles</span></div><div class="tiny" style="margin-top:8px;font-weight:900;color:var(--green)">${esc(title)}</div></div>`}).join('');renderH2HMatrix()}function showManager(uid){const c=careerData().find(x=>x.uid===uid),r=state.rosters.find(x=>x.owner_id===uid);if(!c)return;const roster=(r?.players||[]).map(id=>({id,e:expert(id)})).sort((a,b)=>b.e.score-a.e.score),g=c.w+c.l,seasons=managerSeasonRows(uid),rivals=managerRivalries(uid),records=managerRecords(uid),nem=[...rivals].filter(x=>x.h.b>x.h.a).sort((a,b)=>(b.h.b-b.h.a)-(a.h.b-a.h.a))[0],owned=[...rivals].filter(x=>x.h.a>x.h.b).sort((a,b)=>(b.h.a-b.h.b)-(a.h.a-a.h.b))[0],most=rivals[0],best=seasons.slice().sort((a,b)=>(b.w/(b.w+b.l||1))-(a.w/(a.w+a.l||1)))[0],trophies=c.titles.length?c.titles.map(y=>`<div class="trophy">🏆 ${y} CHAMPION</div>`).join(''):'<div class="empty">No Traphouse championships yet.</div>',summary=c.titles.length?`${c.titles.length}-time Traphouse champion with a ${g?(100*c.w/g).toFixed(1):'0.0'}% career win rate.`:`Veteran Traphouse manager with ${c.w} career wins and still hunting the first championship.`;openModal(managerName(uid),`<div class="managerhero"><h3>${esc(managerName(uid))}</h3><div class="tiny">${esc(summary)}</div></div><div class="profilegrid"><div class="profilestat"><span>Career Record</span><b>${c.w}-${c.l}</b></div><div class="profilestat"><span>Win Rate</span><b>${g?(100*c.w/g).toFixed(1):0}%</b></div><div class="profilestat"><span>Championships</span><b>${c.titles.length}</b></div><div class="profilestat"><span>Seasons Tracked</span><b>${seasons.length}</b></div></div><div class="lineup-label">Trophy Case</div><div class="trophycase">${trophies}</div><div class="lineup-label">Rivalries</div>${nem?`<div class="rivalryline"><b>Nemesis</b><span>${esc(managerName(nem.uid))}</span><b>${nem.h.a}-${nem.h.b}</b></div>`:''}${owned?`<div class="rivalryline"><b>Owned</b><span>${esc(managerName(owned.uid))}</span><b>${owned.h.a}-${owned.h.b}</b></div>`:''}${most?`<div class="rivalryline"><b>Most Played</b><span>${esc(managerName(most.uid))}</span><b>${most.h.g} games</b></div>`:''}<div class="lineup-label">Manager Records</div><div class="profilegrid"><div class="profilestat"><span>High Week</span><b>${records.hi?records.hi.v.toFixed(1):'—'}</b><span>${records.hi?records.hi.season+' W'+records.hi.week:''}</span></div><div class="profilestat"><span>Low Week</span><b>${records.lo?records.lo.v.toFixed(1):'—'}</b><span>${records.lo?records.lo.season+' W'+records.lo.week:''}</span></div><div class="profilestat"><span>Biggest Win</span><b>${records.bigWin?'+'+records.bigWin.d.toFixed(1):'—'}</b></div><div class="profilestat"><span>Worst Loss</span><b>${records.bigLoss?records.bigLoss.d.toFixed(1):'—'}</b></div></div><div class="lineup-label">Season History</div>${seasons.map(x=>`<div class="seasonline"><b>${x.season}</b><span>${x.w}-${x.l} • ${x.pf.toFixed(1)} PF</span><b>${x.champ?'🏆 CHAMP':'—'}</b></div>`).join('')||'<div class="empty">No linked Sleeper seasons.</div>'}${best?`<div class="tiny" style="margin-top:7px">Best tracked regular season: <b>${best.season} (${best.w}-${best.l})</b></div>`:''}<div class="lineup-label">Current Squad</div>${r?roster.map(x=>`<div class="rosterplayer"><b>${esc(x.e.name)}</b><span>${esc(x.e.position)}</span><span>${state.projections[x.id]?state.projections[x.id].toFixed(1)+' proj':'—'}</span></div>`).join(''):'<div class="empty">Not on a current roster.</div>'}`,'Manager profile')}
'''
          s=s[:start]+js+s[end:]
          p.write_text(s)
          PY
      - name: Commit manager upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade manager profiles and rivalries"
          git push
