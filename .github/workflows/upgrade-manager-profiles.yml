name: Upgrade manager profiles
on:
  push:
    paths:
      - '.github/workflows/upgrade-manager-profiles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade manager profiles
        run: |
          python scripts/upgrade_managers.py
      - name: Commit manager upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade manager profiles and rivalries"
          git push
