name: Upgrade power rankings detail
on:
  push:
    paths:
      - '.github/workflows/power-rankings-detail.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch power rankings
        run: python -c "import base64;exec(base64.b64decode(' '))"
      - name: Commit power rankings upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add detailed power rankings analysis"
          git push
