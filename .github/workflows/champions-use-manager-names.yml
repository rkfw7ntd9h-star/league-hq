name: Use manager names in Champions History

on:
  push:
    paths:
      - '.github/workflows/champions-use-manager-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch champion labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='function championManagerName('
          if marker not in s:
              anchor='function championHistoryHtml(h,r,loserRid){'
              if anchor not in s:
                  raise SystemExit('Champion history helper anchor not found')
              helper="function championManagerName(r,users){const u=users.find(x=>String(x.user_id)===String(r?.owner_id));return u?.display_name||u?.username||teamName(r,users)}\n"
              s=s.replace(anchor,helper+anchor,1)
          old='title=teamName(r,h.users)'
          new='title=championManagerName(r,h.users)'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Champion title anchor not found')
          old2="opp=loser?teamName(loser,h.users):'Opponent unavailable'"
          new2="opp=loser?championManagerName(loser,h.users):'Opponent unavailable'"
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('Championship opponent anchor not found')
          p.write_text(s)
          PY
      - name: Commit site change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show manager names in Champions History'
          git push
