name: Upgrade league records detail
on:
  push:
    paths:
      - '.github/workflows/upgrade-league-records.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch completed-week-only league records
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''.record .when{margin-top:5px;font-size:8px;font-weight:900;color:var(--forest)}.record .matchdetail{margin-top:4px;font-size:9px;line-height:1.35;color:var(--ink)}.record .recordnote{margin-top:5px;font-size:7px;color:var(--muted)}.records-rule{margin:0 4px 10px;padding:8px 10px;background:#edf4ef;border:1px solid #ceded4;border-radius:9px;font-size:8px;line-height:1.4;color:#315d49}'''
          if '.records-rule{' not in s:
              s=s.replace('</style></head>',css+'</style></head>',1)
          old='<section class="page" id="page-records"><div class="sectiontitle"><h2>League Records</h2></div><div class="recordgrid" id="recordGrid"></div>'
          new='<section class="page" id="page-records"><div class="sectiontitle"><h2>League Records</h2></div><div class="records-rule">League records use completed weeks only. The live/current week becomes eligible after the week advances.</div><div class="recordgrid" id="recordGrid"></div>'
          if old in s:
              s=s.replace(old,new,1)
          start=s.find('function recordBook(){')
          end=s.find('async function renderDraftHistory(){',start)
          if start<0 or end<0:
              raise SystemExit('recordBook boundary not found')
          js=r'''function completedRecordGames(){const out=[],currentSeason=+state.league?.season||0,currentWeek=week();state.history.forEach(h=>{h.weeks.forEach(w=>{if(+h.season===currentSeason&&+w.week>=currentWeek)return;group(w.matchups).forEach(pair=>{const a=pair[0],b=pair[1],ra=h.rosters.find(r=>r.roster_id===a.roster_id),rb=h.rosters.find(r=>r.roster_id===b.roster_id);if(!ra||!rb)return;const as=+a.points||0,bs=+b.points||0;if(as===0&&bs===0)return;out.push({season:h.season,week:w.week,a,b,ra,rb,users:h.users,as,bs,total:as+bs,margin:Math.abs(as-bs)})})})});return out}function recordGameCard(label,g,value,mode='game'){if(!g)return`<div class="record"><div class="label">${esc(label)}</div><div class="value">—</div><div class="note">No completed games available.</div></div>`;const an=esc(teamName(g.ra,g.users)),bn=esc(teamName(g.rb,g.users)),score=`${g.as.toFixed(1)} – ${g.bs.toFixed(1)}`;let detail=mode==='team'?`<b>${an}</b> scored ${g.as.toFixed(1)} vs ${bn} (${score})`:`<b>${an}</b> vs <b>${bn}</b><br>${score}`;return`<div class="record"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="when">${g.season} • Week ${g.week}</div><div class="matchdetail">${detail}</div><div class="recordnote">Completed weeks only</div></div>`}function recordBook(){const games=completedRecordGames();if(!games.length){$('recordGrid').innerHTML='<div class="empty">No completed historical matchups available yet.</div>';return}let hi=null,lo=null,big=null,close=null,hiComb=null,loComb=null;games.forEach(g=>{[{score:g.as,opp:g.bs,roster:g.ra,oppRoster:g.rb},{score:g.bs,opp:g.as,roster:g.rb,oppRoster:g.ra}].forEach(t=>{const z={...g,as:t.score,bs:t.opp,ra:t.roster,rb:t.oppRoster};if(!hi||z.as>hi.as)hi=z;if(z.as>0&&(!lo||z.as<lo.as))lo=z});if(!big||g.margin>big.margin)big=g;if(!close||g.margin<close.margin)close=g;if(!hiComb||g.total>hiComb.total)hiComb=g;if(!loComb||g.total<loComb.total)loComb=g});const cards=[recordGameCard('Highest Team Score',hi,hi?hi.as.toFixed(1):'—','team'),recordGameCard('Lowest Team Score',lo,lo?lo.as.toFixed(1):'—','team'),recordGameCard('Biggest Blowout',big,big?big.margin.toFixed(1)+' pts':'—'),recordGameCard('Closest Game',close,close?close.margin.toFixed(1)+' pts':'—'),recordGameCard('Highest Combined Score',hiComb,hiComb?hiComb.total.toFixed(1)+' pts':'—'),recordGameCard('Lowest Combined Score',loComb,loComb?loComb.total.toFixed(1)+' pts':'—')];$('recordGrid').innerHTML=cards.join('');const c=careerData();$('careerRows').innerHTML=c.sort((a,b)=>b.w/(b.w+b.l||1)-a.w/(a.w+a.l||1)).map((x,i)=>`<div class="trow careerrow"><b>${i+1}</b><b>${esc(managerName(x.uid))}</b><span>${x.w}-${x.l}</span><span>${((100*x.w/(x.w+x.l||1))).toFixed(1)}%</span><span>${x.titles.length}</span></div>`).join('');const ch=[];state.history.slice().reverse().forEach(h=>{const c=h.winners.find(x=>+x.p===1),rid=c?.w||c?.roster_id;if(rid){const r=h.rosters.find(x=>x.roster_id===rid);ch.push(`<div class="champ"><span class="year">${h.season}</span> <b>🏆 ${esc(teamName(r,h.users))}</b></div>`)}});LEGACY_CHAMPIONS.slice().sort((a,b)=>b.season-a.season).forEach(x=>ch.push(`<div class="champ"><span class="year">${x.season}</span> <b>🏆 ${esc(x.manager)}</b><div class="tiny">Pre-Sleeper champion</div></div>`));$('champions').innerHTML=ch.join('')||'<div class="empty">No champions found.</div>'}'''
          s=s[:start]+js+s[end:]
          p.write_text(s)
          PY
      - name: Commit record upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use completed weeks only for league records"
          git push
