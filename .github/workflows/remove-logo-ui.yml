name: Upgrade Managers UI
on:
  push:
    paths:
      - '.github/workflows/remove-logo-ui.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply manager upgrade
        run: python scripts/upgrade_managers.py
      - name: Commit manager upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade Managers hub and profiles"
          git push
