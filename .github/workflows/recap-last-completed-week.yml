name: Recap Last Completed Week
on:
  push:
    paths:
      - 'scripts/recap_last_completed_week.py'
      - '.github/workflows/recap-last-completed-week.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/recap_last_completed_week.py
      - name: Verify targeted change
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'const recapWeek=Math.max(0,week()-1)' in s
          assert 'id="recapWeekNo"' in s
          assert "rw.textContent=week()>1?week()-1:'—'" in s
          assert 'assets/traphouse-banner.webp' in s
          print('recap patch verified')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make recap use last completed week'
          git push
